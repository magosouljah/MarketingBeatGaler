<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BeatGaler — Reference-driven orbit study 03</title>
<style>
:root{color-scheme:dark} *{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#f4f4f4;overflow:hidden}
body{display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,sans-serif}
#stage{position:relative;width:min(100vw,calc(100vh * .5625));height:min(100vh,calc(100vw * 1.77778));overflow:hidden;isolation:isolate;background:#f4f4f4}

#art{position:absolute;inset:0;z-index:1;width:100%;height:100%;display:block}
#finish{position:absolute;inset:0;z-index:2;pointer-events:none}
#grain{display:none}
#status{position:absolute;z-index:4;bottom:28px;left:0;right:0;color:#9c9ca4;text-align:center;letter-spacing:.19em;font-size:10px;opacity:0}
#status.show{opacity:1}
#center-copy{position:absolute;z-index:4;top:47%;left:0;width:100%;text-align:center;font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:62px;letter-spacing:-.055em;color:#111;transform:translateY(-50%);pointer-events:none}
</style>
</head>
<body>
<div id="stage" data-composition-id="bg-cover-orbit-v3" data-no-timeline data-width="720" data-height="1280" data-duration="3.333333" data-fps="30">
  <canvas id="art" width="720" height="1280" aria-label="An animated cinematic three-dimensional orbit of BeatGaler beat cover art"></canvas>
  <div id="finish"></div><div id="grain"></div><div id="status"></div>
</div>
<script>

const vert=`#version 300 es
precision highp float;

quad([.5,-.5,-z],[-.5,-.5,-z],[-.5,.5,-z],[.5,.5,-z],[0,0,-1],2,A);
quad([-.5,-.5,-z],[.5,-.5,-z],[.5,-.5,z],[-.5,-.5,z],[0,-1,0],1,A);
quad([-.5,.5,z],[.5,.5,z],[.5,.5,-z],[-.5,.5,-z],[0,1,0],1,A);
quad([-.5,-.5,z],[-.5,-.5,-z],[-.5,.5,-z],[-.5,.5,z],[-1,0,0],1,A);
quad([.5,-.5,-z],[.5,-.5,z],[.5,.5,z],[.5,.5,-z],[1,0,0],1,A);
const pbuf=attrib('a_pos',A.p),nbuf=attrib('a_normal',A.normal),ubuf=attrib('a_uv',A.uv);
const textures=[];
const exts=['jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','jpg','avif','avif','avif','avif'];

const cards=Array.from({length:N},(_,i)=>({i,tex:null}));
function loadImg(i){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{cards[i].image=im;cards[i].tex=texUpload(im);resolve()};im.onerror=()=>reject(new Error('Missing artwork '+(i+1)));im.src=(window.__embeddedCovers?.[i]||'assets/covers/cover-'+String(i+1).padStart(2,'0')+'.'+exts[i])})}
// TRACE: source 1.20–4.53s only. Observed source behavior is catalogued in
// ORBIT-APPLE-REFERENCE-ANALYSIS.md. 3D positions/camera are FIT HYPOTHESES.
// These are not the old V1/V2 circular choreography.
function coverPose(i,t){
 const s=clamp(t,0,DURATION)+1.20;   // local output time -> reference source time
 const order=(i*13)%24;
 const easeOut=x=>1-Math.pow(1-clamp(x,0,1),3);
 const theta=order*Math.PI*2/24
  + .092*Math.sin(order*1.73)
  + .63*(s-1.75)
  + .035*Math.sin(i*1.91)
  + .024*(s-1.75)*Math.sin(i*.87);
 const birth=.13+.87*easeOut((s-1.22-(i%4)*.018)/.55);

 let y=ry*Math.sin(theta)+.10*Math.cos(3*theta+i*.8);
 let z=.05+2.15*Math.cos(theta-.2)+.42*Math.sin(2*theta+i*.23);
 let yaw=1.55*(1-Math.cos(theta))/2+.065*Math.sin(i*.7+s*.8);
 let pitch=1.29*Math.sin(theta)*(.63+.37*(1-Math.cos(theta))/2)+.055*Math.sin(i*.8);
 let roll=.13*Math.cos(theta)-.10*Math.sin(2*theta);
 let size=(1.30+.12*Math.sin(i*2.12))*(.81+.19*Math.cos(theta));

 // Only cards already near the camera/right-hand arc are chosen; others peel off.
 const packet=[11,22,9,0,7,20,18];
 const hand=smooth((s-3.48)/.39);
 if(hand>0){
  const j=packet.indexOf(i);
  if(j>=0){
   const endx=1.05+.18*(j%3)+.06*j;
   const endy=1.52-.55*j;
   const endz=2.45-.27*j;

   yaw=mix(yaw,-.12+.07*j,hand);
   pitch=mix(pitch,.59+.03*j,hand);
   roll=mix(roll,-.14,hand);
   size=mix(size,1.82+.065*j,hand);
  } else {
   x=mix(x,Math.cos(theta)*9.2+1.2,hand);
   y=mix(y,Math.sin(theta)*6.7+2.1,hand);
   z=mix(z,-1.8,hand);
  }
 }
 // The handoff ends without building Apple's final brand/CTA scene.
 if(packet.includes(i)){
  const j=packet.indexOf(i),leave=smooth((s-4.12)/.40);

  y+=(5.8+.28*j)*leave;

}
function cameraAt(t){
 const s=clamp(t,0,DURATION)+1.2;
 const move=smooth((s-2.15)/1.35),burst=smooth((s-3.45)/.42);
 const eye=[.12*move-.32*burst,.25*move+.04*burst,13.5-2.25*move-3.10*burst];

}
const projection=perspective(48*Math.PI/180,W/H,.1,50);
// Progressive fallback: same 3D camera and object poses projected on CPU for browsers
// where WebGL is unavailable (such as the current headless QA sandbox).
function projectPoint(p,m){
 const clip=[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14],m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15]];

function renderCanvasAt(t){

 const c=cameraAt(t);

 .filter(o=>o.card.image).sort((a,b)=>b.dist-a.dist);
 for(const {card,d,dist} of renderList){

 const mvp=mul(projection,mul(c.view,m));

 ctx.save();ctx.globalAlpha=near*.69*d.opacity;ctx.beginPath();ctx.moveTo(tl[0],tl[1]);ctx.lineTo(tr[0],tr[1]);ctx.lineTo(br[0],br[1]);ctx.lineTo(bl[0],bl[1]);ctx.closePath();ctx.strokeStyle='rgba(203,205,214,.26)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();

function renderAt(input){const t=clamp(input,0,DURATION);if(!gl){renderCanvasAt(t);window.__orbitLastTime=t;return;}gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clearDepth(1);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.disable(gl.BLEND);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(shader);

// A browser-only clock for interactive preview. Renderers drive every frame via hf-seek.
let previewHandle=null;
let previewFrame=0;
if(!new URLSearchParams(location.search).has('capture')){

   if(!deterministicSeek&&window.__orbit.ready)
     renderAt((previewFrame++/30)%DURATION);
 },32);
}
})();
</script>

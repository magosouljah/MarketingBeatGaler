<!doctype html>
<html lang="en">
  <!-- phase2-songs-v1: wheel-v7 (approved 2026-11-06) with per-video variant
       parameters. Layout, copy, wheel rig and every animation are v7's; only
       the values in window.__variant change (see ../README.md). The 720x1280
       v7 frame is drawn at 1.5x inside a 1080x1920 composition. build.py
       replaces __VARIANT_JSON__ and the __...__ times below. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>BeatGaler · phase2-songs-v1 · __ID__</title>
    <script src="lib/gsap.min.js"></script>
    <script>window.__variant = __VARIANT_JSON__;</script>
    <style>
      @font-face {
        font-family: "Archivo Black";
        src: url("assets/fonts/archivo-black-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
      }
      :root {
        --ground: __GROUND__;
        --ink: __INK__;
        --muted: __MUTED__;
        --font-display: "Archivo Black", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--ground);
        overflow: hidden;
      }
      /* the v7 frame, unchanged, drawn at 1.5x */
      #frame {
        position: absolute;
        left: 0;
        top: 0;
        width: 720px;
        height: 1280px;
        transform: scale(1.5);
        transform-origin: 0 0;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }
      .word {
        position: absolute;
        left: __WORD_LEFT__px;
        width: 720px;
        top: 470px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 62px;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      .wt {
        display: inline-block;
        transform-origin: 50% 60%;
      }
      .el {
        display: inline-block;
      }
      #brand {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #brand-mark {
        display: block;
        font-size: 64px;
        letter-spacing: -0.04em;
      }
      #endcard {
        position: absolute;
        inset: 0;
        text-align: center;
      }
      #endcard > * {
        position: absolute;
        left: 0;
        width: 720px;
        display: block;
      }
      #end-brand {
        top: 244px;
        font-size: 48px;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      #end-pre {
        top: 356px;
        font-family: "Archivo", sans-serif;
        font-weight: 400;
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0;
      }
      #end-line {
        top: 396px;
        font-size: 76px;
        line-height: 0.98;
        letter-spacing: -0.04em;
        transform-origin: 50% 45%;
      }
      #end-sub {
        top: 665px;
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      #end-pill {
        top: 778px;
      }
      .pill {
        display: inline-block;
        padding: 0 30px;
        height: 54px;
        line-height: 54px;
        border-radius: 27px;
        background: var(--ink);
        color: var(--ground);
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 21px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #end-fine {
        top: 866px;
        left: 100px;
        width: 520px;
        text-wrap: balance;
        font-family: "Archivo", sans-serif;
        font-weight: 400;
        font-size: 16px;
        line-height: 1.4;
        color: var(--muted);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 720px;
        height: 1280px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="songs" data-start="0" data-duration="__DUR__" data-fps="30" data-width="1080" data-height="1920">
      <div id="frame">
        <div id="brand" class="clip" data-start="0" data-duration="1.2" data-track-index="1"><span id="brand-mark">BeatGaler</span></div>
        <div id="w1" class="word clip" data-start="__W1__" data-duration="__W1D__" data-track-index="2"><span class="wt">Unlimited</span></div>
        <div id="w2" class="word clip" data-start="__W2__" data-duration="__W2D__" data-track-index="2"><span class="wt">Free*</span></div>
        <div id="w3" class="word clip" data-start="__W3__" data-duration="__W3D__" data-track-index="2"><span class="wt">Storage</span></div>
        <div id="endcard" class="clip" data-start="__END__" data-duration="__ENDD__" data-track-index="3">
          <span id="end-brand">BeatGaler</span>
          <span id="end-pre">1 month of</span>
          <span id="end-line"><span class="el">Unlimited</span><br /><span class="el">Free*</span><br /><span class="el">Storage</span></span>
          <span id="end-sub">for your beats<br />and projects</span>
          <!-- FREEGALER is the lab placeholder code: it must exist in BeatGaler before publication. -->
          <span id="end-pill"><span class="pill">CODE: FREEGALER</span></span>
          <span id="end-fine">*New users only. Use code FREEGALER at sign-up for 1 month free, then $11/month (USD). Renews automatically until canceled. Terms apply.</span>
        </div>
        <canvas id="stage" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0" width="1080" height="1920" data-layout-allow-occlusion></canvas>
      </div>
    </div>
    <script>
      const V = window.__variant;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__wheelReady = new Promise((resolve) => (window.__resolveWheel = resolve));
      window.__hf.buildReady["songs-wheel"] = window.__wheelReady;
      window.__labState = { t: 0 };
      window.__labRender = function () {
        if (window.__lab) window.__lab.render(window.__labState.t);
      };
      const tl = gsap.timeline({ paused: true });
      tl.to(window.__labState, { t: V.duration, duration: V.duration, ease: "none", onUpdate: () => window.__labRender() }, 0);
      // brand mark shrink (v7: scale 0.12, x -40, 0.5-1.15 s); variant: x only
      tl.fromTo("#brand-mark", { scale: 1, x: 0 }, { scale: 0.12, x: V.brandX, duration: 0.65, ease: "power2.in" }, 0.5);
      // centre words: v7 motion (cut in small, low and tilted, then never stop),
      // entrance values per variant (v7: y 26, rotation -3.5, scale 0.85, 0.16 s)
      const E = V.wordIn;
      V.words.forEach(([sel, at, hold]) => {
        const inT = E.dur;
        const run = hold - inT;
        const tail = run + 0.4;
        const p = Math.sin((Math.PI / 2) * (run / tail));
        tl.fromTo(sel, { y: E.y, rotation: E.rot, scale: E.from }, { y: 0, rotation: 0, scale: 0.95, duration: inT, ease: "power3.out" }, at);
        tl.to(sel, { y: -26 / p, scale: 0.95 + 0.05 / p, duration: tail, ease: "sine.out" }, at + inT);
      });
      // end card: v7, shifted so the headline cut lands on the song's hit (V.head).
      // Longer films (song length) keep v7's speeds and run every move to the
      // last frame, so no text stands still (v7: headline +0.09 over 2.0 s,
      // lower block -14 px and brand +3 % over 1.7 s).
      const H = V.head, S = V.endStart, D = V.duration - V.endStart;
      const Z = Math.max(2.0, V.duration - H - 0.12);
      const k = D / 1.7;
      tl.fromTo("#end-line", { scale: 0.86, y: 12 }, { scale: 0.93, y: 0, duration: 0.12, ease: "power3.out" }, H);
      tl.to("#end-line", { scale: 1.02 + 0.015 * (Z - 2.0), duration: Z, ease: "power2.out" }, H + 0.12);
      tl.fromTo("#end-line", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.001 }, H);
      tl.fromTo(["#end-sub", "#end-fine"], { y: 0 }, { y: -14 * k, duration: D, ease: "power1.out" }, S);
      tl.fromTo("#end-pill", { y: 0 }, { y: -14 * k, duration: D, ease: "none" }, S);
      tl.fromTo(["#end-brand", "#end-pre"], { scale: 1 }, { scale: 1 + 0.03 * k, duration: D, ease: "sine.out" }, S);
      window.__timelines = window.__timelines || {};
      window.__timelines["songs"] = tl;
      window.addEventListener("hf-seek", (e) => {
        window.__labState.t = e.detail.time;
        window.__labRender();
      });
    </script>
    <script type="module">
      import { createWheel, RIG, track } from "./src/wheel.js";
      const V = window.__variant;
      const W = V.wheel;
      // Variant overrides on the approved rig. Only the part before the stack
      // (t < W.until) is touched; the stack (3.75-4.8 s) keeps v7's values.
      const before = (knots, f) => knots.map(([t, v]) => [t, t < W.until ? f(v, t) : v.slice()]);
      const rig = {
        ...RIG,
        phase0: RIG.phase0 + W.phaseDelta,
        omega: before(RIG.omega, (v) => [v[0] * W.omegaScale]),
        position: before(RIG.position, (v) => [v[0] + W.dx, v[1] + W.dy, v[2]]),
        scale: before(RIG.scale, (v) => [v[0] * W.scaleMul]),
        covers: V.covers,
        pixelRatio: 1.5,
      };
      const lab = createWheel(document.getElementById("stage"), rig);
      lab.ready.then(() => {
        window.__lab = lab;
        window.__labRender();
        window.__resolveWheel();
      });
    </script>
  </body>
</html>

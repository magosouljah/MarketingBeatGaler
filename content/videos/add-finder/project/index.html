<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="theme.js"></script>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "BG Display"; src: url("assets/fonts/InterDisplay-Black.otf") format("opentype"); font-weight: 900; }
      :root {
        --canvas: #090909;
        --font: "SF Pro Text", "Inter", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--canvas); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; }
      #stage { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 50% 50%; overflow: hidden;
        background: radial-gradient(ellipse 90% 60% at 50% 38%, #171717 0%, #0b0b0b 55%, #070707 100%); }
      #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
      .glow { position: absolute; border-radius: 50%; pointer-events: none; }

      /* ---------- Finder-like window (light world) ---------- */
      #finder { position: absolute; left: 80px; top: 270px; width: 920px; height: 1520px; background: #f5f5f6; border-radius: 30px; overflow: hidden;
        box-shadow: 0 0 0 2px rgba(0,0,0,.22), 0 0 260px rgba(255,255,255,.16), 0 80px 160px rgba(0,0,0,.6); color: #1d1d1f; }
      #f-title { position: absolute; left: 0; top: 0; width: 100%; height: 110px; background: linear-gradient(#ededee,#e2e2e4); border-bottom: 2px solid #cfcfd2; }
      #f-dots { position: absolute; left: 34px; top: 42px; display: flex; gap: 16px; }
      #f-dots i { width: 26px; height: 26px; border-radius: 50%; display: block; }
      #f-name { position: absolute; left: 0; width: 100%; top: 33px; text-align: center; font: 650 34px/1.3 var(--font); color: #3a3a3c; letter-spacing: -.01em; }
      #f-cols { position: absolute; left: 0; top: 110px; width: 100%; height: 56px; background: #fafafa; border-bottom: 2px solid #dedee0; font: 500 23px/56px var(--font); color: #7b7b80; }
      #f-cols span { position: absolute; top: 0; }
      #f-list { position: absolute; left: 0; top: 166px; width: 100%; height: 1284px; overflow: hidden; }
      #f-rows { position: absolute; left: 0; top: 0; width: 100%; }
      .row { position: absolute; left: 0; width: 100%; height: 64px; font: 400 27px/64px var(--font); white-space: nowrap; }
      .row .bg { position: absolute; left: 14px; right: 14px; top: 3px; bottom: 3px; border-radius: 12px; background: #2f7bf6; opacity: 0; }
      .row.alt::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; bottom: 0; border-radius: 12px; background: #ececee; }
      .row .ico { position: absolute; left: 34px; top: 11px; width: 42px; height: 42px; border-radius: 9px; background: linear-gradient(#8e8e93,#6f6f75); }
      .row .ico::after { content: ""; position: absolute; left: 9px; top: 12px; width: 4px; height: 18px; border-radius: 2px; background: #fff;
        box-shadow: 7px -5px 0 0 #fff, 7px 5px 0 0 #fff, 14px 2px 0 0 #fff, 14px -2px 0 0 #fff, 21px -6px 0 0 #fff, 21px 6px 0 0 #fff; opacity: .92; }
      .row .txt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .row .n { position: absolute; left: 92px; color: #1d1d1f; }
      .row .d { position: absolute; left: 520px; color: #86868b; font-size: 24px; }
      .row .s { position: absolute; left: 770px; color: #86868b; font-size: 24px; }
      #f-foot { position: absolute; left: 0; bottom: 0; width: 100%; height: 70px; background: #ececee; border-top: 2px solid #d6d6d9; font: 500 23px/70px var(--font); color: #7b7b80; text-align: center; }
      #f-thumb { position: absolute; right: 10px; top: 0; width: 9px; height: 30px; border-radius: 5px; background: rgba(0,0,0,.34); }
      #f-dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

      /* ---------- Beat entity: file tile -> real BeatCard (app metrics x1.9) ---------- */
      .ent { position: absolute; left: -152px; top: -152px; width: 304px; height: 454px; transform-style: flat; opacity: 0; color: #e5e5e5; will-change: transform; }
      .tile { position: absolute; left: 0; top: 0; width: 304px; height: 304px; border-radius: 19px; overflow: hidden; background: linear-gradient(150deg,#343437 0%,#1d1d1f 70%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.10), 0 0 0 1.5px rgba(255,255,255,.08), 0 30px 72px rgba(0,0,0,.5); }
      .tile .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 13px; }
      .tile .glyph { color: #96969c; }
      .tile .glyph b { display: block; width: 13px; border-radius: 7px; background: currentColor; }
      .tile .glyph b.m { background: #7d93b8; }
      .tile img.cov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; }
      .tile img.ficon { position: absolute; left: 22%; top: 22%; width: 56%; height: 56%; object-fit: contain; display: block; }
      .row img.ico2 { position: absolute; left: 31px; top: 8px; width: 48px; height: 48px; object-fit: contain; background: none; border-radius: 0; }
      .row .ico.mp3 { background: linear-gradient(#7d93b8,#566d94); }
      #wall { position: absolute; inset: 0; z-index: 52; visibility: hidden; pointer-events: none; }
      .wb { position: absolute; left: 80px; top: 0; white-space: nowrap; color: #111113; font: 900 100px/.92 "BG Display",var(--font); letter-spacing: -.04em; word-spacing: -.02em;
        text-shadow: 0 0 22px rgba(245,245,246,.95), 0 0 6px rgba(245,245,246,.9), 0 10px 26px rgba(0,0,0,.16); }
      .wb div { display: block; width: max-content; }
      #bar { position: absolute; left: 0; top: 400px; width: 1080px; height: 240px; overflow: hidden; z-index: 47; visibility: hidden; filter: url(#vblur2); }
      #barstrip { position: absolute; left: 0; top: 0; width: 1080px; }
      .br { height: 240px; padding-left: 80px; text-align: left; white-space: nowrap; color: #111113; font: 900 170px/240px "BG Display",var(--font); letter-spacing: -.04em;
        text-shadow: 0 0 22px rgba(245,245,246,.95), 0 0 6px rgba(245,245,246,.9), 0 10px 26px rgba(0,0,0,.16); }
      #line2 { position: absolute; left: 0; top: 300px; width: 1080px; height: 300px; overflow: hidden; z-index: 31; visibility: hidden; filter: url(#vblur2); }
      #l2strip { position: absolute; left: 0; top: 0; width: 1080px; }
      #l2strip div { height: 300px; text-align: center; white-space: nowrap; color: #fff; font: 900 158px/300px "BG Display",var(--font); letter-spacing: -.04em; text-shadow: 0 10px 46px rgba(0,0,0,.85), 0 3px 8px rgba(0,0,0,.5); }
      #vig { position: absolute; inset: 0; z-index: 41; pointer-events: none; opacity: 0; background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%); }
      #grain { position: absolute; inset: 0; z-index: 60; pointer-events: none; opacity: .06; background: url("assets/grain.png"); mix-blend-mode: overlay; }
      #iris { position: absolute; left: -100px; top: -100px; width: 200px; height: 200px; border-radius: 50%; background: #000; z-index: 42; opacity: 0; }
      #tagbar { position: absolute; left: 0; top: 0; width: 1010px; height: 60px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, black 0%, black calc(100% - 92px), transparent 100%); mask-image: linear-gradient(90deg, black 0%, black calc(100% - 92px), transparent 100%); }
      #tagtrack { display: flex; align-items: center; gap: 15px; width: max-content; height: 60px; white-space: nowrap; }
      .tg { flex: none; display: inline-block; text-align: center; padding: 0 4px; font: 430 51px/1.15 var(--font); letter-spacing: -.042em; color: #828282; opacity: 0; }
      .tile .lite { position: absolute; inset: 0; background: linear-gradient(150deg,#fdfdfe 0%,#d7d7dd 78%); }
      .tile .disc { position: absolute; inset: 0; background-size: cover; clip-path: circle(45.9% at 50% 49.6%); transform-origin: 50% 49.6%; opacity: 0; }
      .tile .play { position: absolute; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: center; justify-content: center; opacity: 0; }
      .tile .play svg { width: 78px; height: 78px; }
      .tile .play .bars { position: absolute; display: flex; gap: 7px; align-items: flex-end; height: 46px; opacity: 0; }
      .tile .play .bars b { display: block; width: 9px; height: 100%; border-radius: 5px; background: #fff; transform-origin: bottom; }
      #end { position: absolute; inset: 0; z-index: 43; opacity: 0; background: none; perspective: 1400px; overflow: hidden; }
      .orb { display: none; position: absolute; left: -120px; top: -120px; width: 240px; height: 240px; border-radius: 16px; overflow: hidden; opacity: 0; box-shadow: 0 0 0 1.5px rgba(255,255,255,.07), 0 26px 60px rgba(0,0,0,.5); }
      .orb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #escrim { position: absolute; left: 0; top: 330px; width: 1080px; height: 900px; background: radial-gradient(ellipse 62% 50% at 50% 50%, rgba(0,0,0,.82) 20%, rgba(0,0,0,.55) 55%, rgba(0,0,0,0) 78%); }
      #ebrand { position: absolute; left: 0; top: 470px; width: 1080px; height: 190px; text-align: center; font: 700 156px/190px var(--font); letter-spacing: -.072em; color: #f5f5f5; white-space: nowrap; }
      #ebrand span { display: inline-block; opacity: 0; }
      #epill { position: absolute; left: 0; top: 750px; width: 1080px; text-align: center; }
      #epillin { display: inline-flex; align-items: center; height: 136px; padding: 0 64px; border-radius: 999px; background: #f5f5f5; color: #0c0c0c; font: 600 56px/1 var(--font); letter-spacing: -.02em; opacity: 0; box-shadow: 0 18px 50px rgba(255,255,255,.12), 0 12px 35px rgba(0,0,0,.4); white-space: nowrap; }
      #epillin b { font-weight: 800; margin-left: .3em; }
      #esub { position: absolute; left: 0; top: 1040px; width: 1080px; text-align: center; font: 500 58px/1.2 var(--font); letter-spacing: -.02em; color: #c9c9cf; white-space: nowrap; text-shadow: 0 2px 12px rgba(0,0,0,.85); }
      #esub span { display: inline-block; margin: 0 .13em; opacity: 0; } #esub b { color: #fff; font-weight: 700; }
      #tap { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; border: 6px solid rgba(47,123,246,.9); opacity: 0; z-index: 45; }
      .tile .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .tile .sheen { position: absolute; top: -20%; left: 0; width: 46%; height: 140%; opacity: 0;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 50%, rgba(255,255,255,0) 100%); }
      .fname { position: absolute; left: 0; top: 318px; width: 304px; font: 500 21px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #77777b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; }
      .meta { position: absolute; left: 0; top: 304px; width: 304px; height: 150px; padding-top: 13px; }
      .meta .title { height: 42px; display: flex; align-items: center; font: 600 25px/1.2 var(--font); color: #e6e6e6; white-space: nowrap; overflow: hidden; opacity: 0; }
      .meta .title span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .meta .title i { font: 400 34px/1 var(--font); color: #b2b2b2; letter-spacing: 1px; font-style: normal; transform: translateY(-8px); }
      .meta .detail { height: 36px; display: flex; align-items: center; justify-content: space-between; }
      .meta .stars { font-size: 21px; letter-spacing: -2px; white-space: nowrap; }
      .meta .stars s { text-decoration: none; color: #454545; }
      .meta .bk { font: 400 20px/1 var(--font); color: #818181; letter-spacing: -.3px; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; }
      .meta .tags { height: 47px; display: flex; align-items: center; gap: 6px; }
      .meta .tag { height: 38px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 999px; font: 400 21px/1 var(--font); border: 2px solid; opacity: 0; transform-origin: 0 50%; }

      .dust { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; filter: blur(2px); }
      #hit { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 40; background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%); }
      #brand { position: absolute; left: -460px; top: -90px; width: 920px; height: 180px; text-align: center; font: 700 150px/180px var(--font); letter-spacing: -.072em; color: #f5f5f5; white-space: nowrap; }
      #brand span { display: inline-block; opacity: 0; }

      /* ---------- Cursor character (BeatGaler's own pixel hand) ---------- */
      /* ---------- light theme: same film on white ---------- */
      html[data-theme="light"], html[data-theme="light"] body { background: #fff; }
      html[data-theme="light"] #stage { background: radial-gradient(ellipse 90% 60% at 50% 38%, #ffffff 0%, #f6f6f8 55%, #eeeef1 100%); }
      html[data-theme="light"] #finder { box-shadow: 0 0 0 2px rgba(0,0,0,.10), 0 70px 150px rgba(0,0,0,.22); }
      html[data-theme="light"] #f-dim, html[data-theme="light"] #hit { display: none; }
      html[data-theme="light"] .tile { background: linear-gradient(150deg,#ececf0 0%,#dcdce2 70%); box-shadow: inset 0 2px 0 rgba(255,255,255,.8), 0 0 0 1.5px rgba(0,0,0,.07), 0 26px 60px rgba(0,0,0,.15); }
      html[data-theme="light"] .fname { color: #8a8a90; }
      html[data-theme="light"] .meta .title { color: #141416; }
      html[data-theme="light"] .meta .title i { color: #8a8a90; }
      html[data-theme="light"] .meta .bk { color: #77777c; }
      html[data-theme="light"] .dust { background: #000; }
      html[data-theme="light"] .glow { display: none; }
      html[data-theme="light"] #brand { color: #0c0c0c; }
      html[data-theme="light"] .tg { color: #8a8a8a; }
      html[data-theme="light"] #l2strip div { color: #0c0c0c; text-shadow: 0 0 34px rgba(255,255,255,.95), 0 0 10px rgba(255,255,255,.9); }
      html[data-theme="light"] #vig { background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(255,255,255,0) 52%, rgba(214,214,222,.5) 100%); }
      html[data-theme="light"] #escrim { background: radial-gradient(ellipse 62% 50% at 50% 50%, rgba(255,255,255,.92) 20%, rgba(255,255,255,.62) 55%, rgba(255,255,255,0) 78%); }
      html[data-theme="light"] #ebrand { color: #0c0c0c; }
      html[data-theme="light"] #epillin { background: #0c0c0c; color: #f5f5f5; box-shadow: 0 18px 46px rgba(0,0,0,.2); }
      html[data-theme="light"] #esub { color: #5a5a60; text-shadow: none; }
      html[data-theme="light"] #esub b { color: #000; }
      #cursor { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 50; opacity: 0; }
      #cursor svg { position: absolute; left: -68px; top: -8px; width: 128px; height: 176px; overflow: visible; filter: drop-shadow(0 10px 10px rgba(0,0,0,.35)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.9" data-width="1080" data-height="1920" data-fps="30">
      <div id="stage" class="clip" data-start="0" data-duration="11.9" data-track-index="0">
        <div id="world">
          <div class="glow" id="g1" style="left:-1500px;top:-7300px;width:2600px;height:2600px;background:radial-gradient(circle,rgba(255,138,48,.16),rgba(255,138,48,0) 62%);transform:translateZ(-900px)"></div>
          <div class="glow" id="g2" style="left:-200px;top:-5200px;width:3000px;height:3000px;background:radial-gradient(circle,rgba(92,110,255,.14),rgba(92,110,255,0) 62%);transform:translateZ(-1100px)"></div>
          <div id="finder">
            <div id="f-title"><div id="f-dots"><i style="background:#ee6a5f"></i><i style="background:#f5bd4f"></i><i style="background:#61c454"></i></div><div id="f-name">Beats</div></div>
            <div id="f-cols"><span style="left:92px">Name</span><span style="left:520px">Date Modified</span><span style="left:770px">Size</span></div>
            <div id="f-list"><div id="f-rows"></div><div id="f-thumb"></div></div>
            <div id="f-foot">847 items</div>
            <div id="f-dim"></div>
          </div>
          <div id="brand"></div>
          <div id="tagbar"><div id="tagtrack"></div></div>
        </div>
        <svg width="0" height="0" style="position:absolute"><filter id="vblur" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur id="vblurfe" stdDeviation="0 0"/></filter><filter id="vblur2" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur id="vblurfe2" stdDeviation="0 0"/></filter><filter id="wbf0" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="wbfe0" stdDeviation="0 0"/></filter><filter id="wbf1" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="wbfe1" stdDeviation="0 0"/></filter><filter id="wbf2" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="wbfe2" stdDeviation="0 0"/></filter></svg>
        <div id="wall"></div>
        <div id="bar"><div id="barstrip"><div class="br">NO IDEA</div><div class="br">WHICH</div><div class="br">ONE&rsquo;S</div><div class="br">WHICH</div></div></div>
        <div id="line2"><div id="l2strip"><div>A BETTER</div><div>WAY.</div></div></div>
        <div id="vig"></div><div id="iris"></div>
        <div id="end"><div id="escrim"></div><div id="ebrand"><span>B</span><span>e</span><span>a</span><span>t</span><span>G</span><span>a</span><span>l</span><span>e</span><span>r</span></div>
          <div id="epill"><div id="epillin">Comment<b>GALER</b></div></div>
          <div id="esub"><span>to</span><span>try</span><span>it</span><span>for</span><span><b>free</b></span></div></div>
        <div id="grain"></div>
        <div id="hit"></div>
        <div id="tap"></div>
        <div id="cursor"><svg viewBox="0 0 16 22" shape-rendering="crispEdges"></svg></div>
      </div>
    </div>
    <script>
      /* ================= timing: 147 BPM, bar = 1.6327 s ================= */
      const BEAT = 60 / 147, BAR = BEAT * 4;
      // Hit times are the measured transients of the beat (grid + ~35 ms of mp3 latency), not round seconds.
      // Every hit below is a measured transient of the beat, after the re-cut that brings the drop forward.
      // Audio edit: file 0.546-10.612 plays from T=0, then file 14.717 onward (0.42 s of silence, then the drop).
      const H0 = 4.80;     // kick, groove enters: click + takeoff
      const HS = 5.604;    // first snare: flight accent
      const H1 = 6.031;    // kick: everything snaps into the grid
      const ROLL = [6.141, 6.274, 6.414, 6.55, 6.687]; // snare roll: bursts of mutation
      const TBRAND = 7.25; // wordmark lights up while the camera is still pushing in
      const TBAR = 7.645;  // snare: tag bar slides in, cursor lands
      const THOVT = 7.845; // snare: cursor is on the tag
      const TF = 8.071;    // kick: click on the tag
      const TEND = 8.681;  // kick: zoom lands on the CTA, brand
      const TPILL = 8.873, TTAP = 10.93; // snare: pill; kick: tap on "free"
      const TFOUND = 99, TSIL = 99, TDROP = 99, TBLACK = 99; // scenes removed from this cut
      const DUR = 11.9;
      const THEME = (window.BG_THEME==="light")?"light":"dark"; const LIGHT = THEME==="light"; document.documentElement.dataset.theme=THEME;

      /* ================= deterministic helpers ================= */
      function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
      const rnd = mulberry(1470);
      const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u;
      const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
      const E={lin:u=>u,inQ:u=>u*u,outQ:u=>1-(1-u)*(1-u),inC:u=>u*u*u,outC:u=>1-Math.pow(1-u,3),
        ioC:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, outE:u=>u>=1?1:1-Math.pow(2,-10*u),
        outB:u=>{const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)},
        ioS:u=>-(Math.cos(Math.PI*u)-1)/2};
      // keyframes: [[t, v, easeIntoThisKey], ...]
      function kf(t,k){ if(t<=k[0][0])return k[0][1]; for(let i=1;i<k.length;i++){ if(t<=k[i][0]){const u=(t-k[i-1][0])/(k[i][0]-k[i-1][0]);return lerp(k[i-1][1],k[i][1],(k[i][2]||E.lin)(u));}} return k[k.length-1][1]; }
      // damped pulse after an impact at time h
      const pulse=(t,h,amp,decay=11,freq=26)=> t<h?0:amp*Math.exp(-(t-h)*decay)*Math.cos((t-h)*freq);

      /* ================= data ================= */

            l.style.textShadow=LIGHT?"none":`0 0 ${(80*g).toFixed(0)}px rgba(255,255,255,${(.8*g).toFixed(3)}), 0 4px 20px rgba(0,0,0,.6)`;});
          const pa=seg(t,TPILL,TPILL+.3); ePill.style.opacity=Math.min(1,pa*2.5).toFixed(3); ePill.style.transform=`scale(${((pa<=0?.5:.5+.5*E.outB(pa))*(1-pulse(t,TTAP,.07,11,24))).toFixed(4)})`;
          eSub.forEach((w,k)=>{const a=E.outC(seg(t,ESUBT[k],ESUBT[k]+.18)); w.style.opacity=a.toFixed(3); w.style.transform=`translateY(${((1-a)*14).toFixed(1)}px)`; w.style.filter=a<.98?`blur(${((1-a)*8).toFixed(1)}px)`:"none";});
        }
        drawCursor(t);
      }

      /* ================= HyperFrames contract: one paused, seekable root timeline ================= */
      const driver={}; let _t=0; Object.defineProperty(driver,"t",{get(){return _t;},set(v){_t=v;frame(v);}});
      window.__timelines=window.__timelines||{};
      const tl=gsap.timeline({paused:true});
      tl.to(driver,{t:DUR,duration:DUR,ease:"none"},0);
      window.__timelines["main"]=tl;
      tl.seek(0); frame(0);
    </script>
  </body>

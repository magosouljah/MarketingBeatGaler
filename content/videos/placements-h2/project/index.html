<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/ig.css" />
    <link rel="stylesheet" href="css/desk.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.51" data-width="1080" data-height="1920" data-fps="30">
      <div id="stage" class="clip" data-start="0" data-duration="24.51" data-track-index="0">
        <div id="bgglow"></div>
        <div id="sDesk"></div>
        <div id="sIG"></div>
        <div id="kt"></div>
        <div id="vig"></div>
        <div id="grain"></div>
        <div id="tap"></div>
        <div id="cursor"><svg viewBox="0 0 16 22" shape-rendering="crispEdges"></svg></div>
        <svg width="0" height="0" style="position:absolute">
          <filter id="vb0" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="vb0fe" stdDeviation="0 0"/></filter>
          <filter id="vb1" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="vb1fe" stdDeviation="0 0"/></filter>
          <filter id="vb2" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur id="vb2fe" stdDeviation="0 0"/></filter>
        </svg>
      </div>
    </div>
    <script src="js/icons.js"></script>
    <script src="js/variant.js"></script>
    <script src="js/lib.js"></script>
    <script src="js/timing.js"></script>
    <script src="js/type.js"></script>
    <script src="js/ig.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/desk.js"></script>
    <script src="js/ig-close.js"></script>
    <script src="js/cta.js"></script>
    <script src="js/main.js"></script>

</html>

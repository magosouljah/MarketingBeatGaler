name: Learning Engine CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit learning history and protected direction
        run: python learning/engine.py audit
      - name: Run unit tests
        run: python -m unittest discover -s learning/tests -v

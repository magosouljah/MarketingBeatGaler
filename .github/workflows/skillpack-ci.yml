name: Skills Library CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pinned source catalog
        run: python skillpack/manager.py validate
      - name: Run offline skill installer tests
        run: python -m unittest discover -s skillpack/tests -v
      - name: Smoke install one pinned external skill (never execute source code)
        run: |
          python skillpack/manager.py install --profile phase2 --agent codex --skill reference-to-motion
          test -f .agents/skills/reference-to-motion/SKILL.md
          test -f .agents/skills/reference-to-motion/_beatgaler-source.json
      - name: Audit protected project direction
        run: python learning/engine.py audit
